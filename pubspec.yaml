name: inventory_app
description: "QR- és vonalkód alapú készletkezelő alkalmazás."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Alap Flutter UI
  cupertino_icons: ^1.0.8

  # QR- és vonalkód olvasás
  mobile_scanner: ^7.2.0

  # Kamera + képfeldolgozás (JPEG → PNG konvertálás)
  camera: ^0.11.2+1
  image: ^4.5.4
  path_provider: ^2.1.5

  # Hálózat és kapcsolatfigyelés
  http: ^1.6.0
  connectivity_plus: ^7.1.1

  # Háttérfeladatok
  workmanager: ^0.9.0+3

  # State management
  provider: ^6.1.5+1

  # Fájlkezelés
  path: ^1.9.0

  # Helyi adatbázis (Android + iOS kompatibilis)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/