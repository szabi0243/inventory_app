name: inventory_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI és alap működés
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.2.0
  http: ^1.6.0
  connectivity_plus: ^7.1.1
  workmanager: ^0.9.0+3
  provider: ^6.1.5+1
  path: ^1.9.0

  # Adatbázis (SQFLITE - ez hiányzott!)
  sqflite: ^2.4.1

  # (Opcionális - ha később Drift-et akarsz használni)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true